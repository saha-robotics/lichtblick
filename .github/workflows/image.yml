name: Image
# The cluster's Lichtblick: the web build behind nginx. Tagged with the
# package version, so the chart's appVersion names exactly one build.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/saha-robotics/lichtblick:${{ steps.v.outputs.version }}
            ghcr.io/saha-robotics/lichtblick:main
          cache-from: type=gha
          cache-to: type=gha,mode=max
