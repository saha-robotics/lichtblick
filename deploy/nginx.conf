server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Hashed bundles are immutable; index.html must not be cached, or a deploy
  # leaves browsers on a stale shell pointing at bundles that no longer exist.
  location = /index.html { add_header Cache-Control "no-cache"; }
  location ~* \.(js|css|wasm|png|svg|woff2?)$ { add_header Cache-Control "public, max-age=31536000, immutable"; }
  location / { try_files $uri $uri/ /index.html; }

  # Lichtblick's data-source URL is read from the query string; nothing here
  # needs to see it, so keep it out of the access log.
  access_log off;
}
